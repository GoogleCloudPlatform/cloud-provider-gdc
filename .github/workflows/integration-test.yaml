name: Presubmit Integration Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to test (leave empty to test the selected branch). Requires head_sha for fork or non-OWNERS PRs.'
        required: false
        type: string
      head_sha:
        description: 'Full 40-character SHA of the reviewed head commit (required with pr_number for fork or non-OWNERS PRs)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration-test:
    name: CCM Integration Test (GDC Staging)
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/test-integration'))
    runs-on: ubuntu-latest
    environment: gdc-staging
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Verifies author/commenter authorization strictly against origin/main
      # (without exposing GDC secrets), stages trusted CI scripts and the
      # compiled token-helper binary in /tmp/ci-trusted, and checks out + merges
      # origin/main into the target PR when triggered via /test-integration or workflow_dispatch.
      # Manual triggers on fork or non-OWNERS PRs name the reviewed head commit;
      # a PR whose head changed before the job runs is not checked out.
      - name: Verify CI Preconditions
        id: preconditions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          CHECK_NAME: CCM Integration Test (GDC Staging)
        run: |
          # The gate is always loaded from main, never from the checked-out
          # tree, which a pull request controls.
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          mkdir -p /tmp/ci-bootstrap
          if ! git show refs/remotes/origin/main:scripts/ci-common.sh > /tmp/ci-bootstrap/ci-common.sh; then
            echo "::error::Cannot load scripts/ci-common.sh from origin/main."
            exit 1
          fi
          source /tmp/ci-bootstrap/ci-common.sh
          verify_and_prepare_ci

      - name: Log in to ghcr.io
        if: steps.preconditions.outputs.should_run == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CCM Integration Test
        if: steps.preconditions.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_NAME: CCM Integration Test (GDC Staging)
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/cloud-controller-manager-gdch
          GDC_CCM_SERVICE_ACCOUNT_KEY: ${{ secrets.GDC_CCM_SERVICE_ACCOUNT_KEY }}
          # Optional PEM CA for labs whose console certificate is not publicly trusted.
          GDC_BOOTSTRAP_CA_PEM: ${{ vars.GDC_BOOTSTRAP_CA_PEM }}
        run: bash "${CI_TRUSTED_DIR}/scripts/ci-integration-test.sh"
