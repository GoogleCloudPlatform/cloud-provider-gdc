name: Presubmit Integration Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'OWNERS*'
      - 'CODEOWNERS'
      - 'LICENSE*'
      - 'NOTICE*'
      - '.gitignore'
      - '.github/renovate.json5'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to test (leave empty to test the selected branch)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration-test:
    name: CCM Integration Test (GDC Staging)
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/test-integration'))
    runs-on: ubuntu-latest
    environment: gdc-staging
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Verifies author/commenter authorization strictly against origin/main
      # (without exposing GDC secrets), stages trusted CI scripts and the
      # compiled token-helper binary in /tmp/ci-trusted, and checks out + merges
      # origin/main into the target PR when triggered via /test-integration or workflow_dispatch.
      - name: Verify CI Preconditions
        id: preconditions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_NAME: CCM Integration Test (GDC Staging)
        run: |
          git fetch origin main
          mkdir -p /tmp/ci-bootstrap
          if git show origin/main:scripts/ci-common.sh 2>/dev/null | grep -q 'should_skip_non_code_changes'; then
            git show origin/main:scripts/ci-common.sh > /tmp/ci-bootstrap/ci-common.sh
          else
            cp ./scripts/ci-common.sh /tmp/ci-bootstrap/ci-common.sh
          fi
          source /tmp/ci-bootstrap/ci-common.sh
          verify_and_prepare_ci

      - name: Log in to ghcr.io
        if: steps.preconditions.outputs.should_run == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CCM Integration Test
        if: steps.preconditions.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_NAME: CCM Integration Test (GDC Staging)
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/cloud-controller-manager-gdch
          GDC_CCM_SERVICE_ACCOUNT_KEY: ${{ secrets.GDC_CCM_SERVICE_ACCOUNT_KEY }}
        run: bash "${CI_TRUSTED_DIR}/scripts/ci-integration-test.sh"
